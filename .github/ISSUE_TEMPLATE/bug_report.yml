name: Bug report / Помилка
description: Report a reproducible problem with installation, menus or conversion.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: ConvertIt and Windows versions / Версії
      placeholder: ConvertIt 0.8.0.2, Windows 11 24H2 x64
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / Частина програми
      options:
        - Installation or removal
        - Explorer menu
        - File conversion
        - Language or messages
        - Other
    validations:
      required: true
  - type: input
    id: formats
    attributes:
      label: Input and output formats / Формати
      placeholder: HEIC to JPG, PDF to PNG, or not applicable
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result and actual result / Відтворення
      description: Include the exact error text. English or Ukrainian is welcome.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sanitized sample or additional details / Приклад
      description: Optional. Do not upload private documents or personal information. Use private security reporting for vulnerabilities.
